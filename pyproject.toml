[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mbendagaik-subgoalcover"
version = "0.1.0"
description = "把执行步骤与目标子点对应，标出没有贡献的绕路步骤"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mbendagaik" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://mbendagaik.github.io"
Repository = "https://github.com/mbendagaik/subgoalcover"
Issues = "https://github.com/mbendagaik/subgoalcover/issues"

[project.scripts]
subgoalcover = "subgoalcover:main"

[tool.setuptools]
py-modules = ["subgoalcover"]
